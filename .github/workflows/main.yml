name: Build ABYSS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate levels
        run: python3 tests/test_levels.py -v

      - name: Install CEdev v15.0
        run: |
          curl -fL --retry 3 https://github.com/CE-Programming/toolchain/releases/download/v15.0/CEdev-Linux.tar.gz -o /tmp/cedev.tar.gz
          mkdir -p "$RUNNER_TEMP/cedev"
          tar -xzf /tmp/cedev.tar.gz -C "$RUNNER_TEMP/cedev"
          echo "$RUNNER_TEMP/cedev/CEdev/bin" >> "$GITHUB_PATH"

      - name: Build calculator program
        run: make clean all

      - name: Check build outputs
        run: |
          test -s bin/ABYSS.8xp
          test -f bin/ABYSS.map
          cp bin/ABYSS.8xp bin/ABYSS.map .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: abyss-ti84-ce
          path: |
            ABYSS.8xp
            ABYSS.map
          if-no-files-found: error
